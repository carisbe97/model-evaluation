<div 
  class="min-h-screen flex flex-col bg-brand-dark text-gray-100"
  [class.h-screen]="isEvaluationRoute()"
  [class.overflow-hidden]="isEvaluationRoute()"
>
  <app-navbar />

  <main 
    class="flex-1 flex flex-col min-h-0"
    [class.overflow-hidden]="isEvaluationRoute()"
  >
    <router-outlet />
  </main>

  <app-toast />

  @if (!isEvaluationRoute()) {
    <footer class="border-t border-brand-border/40 py-8 bg-brand-darker text-xs text-gray-500">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="font-display font-bold text-brand-gold tracking-[0.2em] text-sm">VOGUE ELITE</span>
          <span class="text-gray-400">— Plataforma Oficial de Scouting & Evaluación</span>
        </div>
        <div class="flex items-center gap-3 text-[11px] text-gray-400">
          <span class="px-2.5 py-0.5 rounded-full bg-brand-card border border-brand-gold/40 text-brand-gold font-mono text-[11px] font-semibold tracking-wider shadow-sm">
            v{{ appVersion }}
          </span>
          <span>•</span>
          <span>Edición Oficial 2026</span>
          <span>•</span>
          <span>Panel del Jurado Calificador</span>
          <span>•</span>
          <span>Todos los derechos reservados</span>
        </div>
      </div>
    </footer>
  }
</div>
