<div
  class="group relative overflow-hidden rounded-2xl bg-brand-card border border-brand-border/70 hover:border-brand-gold/50 transition-all duration-500 shadow-card-glow hover:shadow-gold-glow flex flex-col cursor-pointer"
  (click)="cardClick.emit(candidata())"
>
  <!-- Media container con aspect ratio editorial -->
  <div class="relative w-full aspect-[3/4] overflow-hidden bg-brand-dark">
    <img
      [src]="candidata().foto_perfil"
      [alt]="candidata().nombre"
      class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out"
      loading="lazy"
    />

    <!-- Gradiente de sombra editorial inferior -->
    <div class="absolute inset-0 bg-gradient-to-t from-brand-darker via-transparent to-black/30"></div>

    <!-- Badge de estado de evaluación individual si existe -->
    @if (isEvaluated()) {
      <div class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-emerald-950/90 border border-emerald-500/50 text-[10px] uppercase font-bold tracking-wider text-emerald-300 flex items-center gap-1 shadow-lg">
        <svg class="w-3 h-3 text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
        Evaluada
      </div>
    }

    <!-- Redes sociales o badge flotante inferior -->
    @if (candidata().url_redes_sociales) {
      <div class="absolute bottom-3 right-3">
        <a
          [href]="candidata().url_redes_sociales"
          target="_blank"
          rel="noopener noreferrer"
          (click)="$event.stopPropagation()"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/70 hover:bg-brand-gold hover:text-black text-white/90 text-[11px] backdrop-blur-md border border-white/20 transition-all duration-300 shadow-md"
          title="Ver perfil de redes sociales"
        >
          <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          <span>Social</span>
        </a>
      </div>
    }
  </div>

  <!-- Información de la candidata -->
  <div class="p-5 flex-1 flex flex-col justify-between">
    <div>
      <h3 class="font-display font-semibold text-lg text-white group-hover:text-brand-goldLight transition-colors">
        {{ candidata().nombre }}
      </h3>
      <p class="text-xs text-gray-400 mt-1">
        Aspirante oficial de alta costura
      </p>
    </div>

    <div class="mt-4 pt-3 border-t border-brand-border/40 flex items-center justify-between">
      <span class="text-xs text-brand-gold font-medium tracking-wider uppercase">
        Candidata #0{{ candidata().id }}
      </span>
      <span class="text-xs text-gray-400 flex items-center gap-1 group-hover:text-brand-gold transition-colors">
        Evaluar
        <svg class="w-3.5 h-3.5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </span>
    </div>
  </div>
</div>
