<div class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-3 max-w-sm sm:max-w-md w-full px-4 sm:px-0 pointer-events-none">
  @for (t of toastService.toasts(); track t.id) {
    <div
      class="toast-item pointer-events-auto flex items-start gap-3.5 px-4.5 py-3.5 rounded-2xl shadow-2xl backdrop-blur-xl border transition-all duration-300"
      [ngClass]="{
        'bg-emerald-950/90 border-emerald-500/50 text-emerald-200 shadow-emerald-950/50': t.type === 'success',
        'bg-red-950/90 border-red-500/50 text-red-200 shadow-red-950/50': t.type === 'error',
        'bg-brand-card/95 border-brand-gold/50 text-brand-gold shadow-black/70': t.type === 'info',
        'bg-amber-950/90 border-amber-500/50 text-amber-200 shadow-amber-950/50': t.type === 'warning'
      }"
    >
      <!-- ÍCONO SEGÚN EL TIPO -->
      <div class="shrink-0 mt-0.5">
        @if (t.type === 'success') {
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        } @else if (t.type === 'error') {
          <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else if (t.type === 'warning') {
          <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        } @else {
          <svg class="w-5 h-5 text-brand-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
      </div>

      <!-- CONTENIDO DEL MENSAJE -->
      <div class="flex-1 min-w-0 pr-1">
        @if (t.title) {
          <h4 class="text-xs font-bold uppercase tracking-wider mb-0.5 opacity-90">{{ t.title }}</h4>
        }
        <p class="text-xs sm:text-sm font-medium leading-snug break-words">{{ t.message }}</p>
      </div>

      <!-- BOTÓN DE CERRAR -->
      <button
        type="button"
        (click)="toastService.remove(t.id)"
        class="shrink-0 p-1 rounded-lg text-current opacity-70 hover:opacity-100 hover:bg-white/10 transition-all cursor-pointer -mr-1 -mt-0.5"
        aria-label="Cerrar notificación"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
