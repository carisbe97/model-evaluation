<div class="rounded-2xl bg-brand-card border border-brand-border/80 shadow-xl p-2.5 sm:p-3 transition-all flex items-center justify-between gap-3">
  
  <!-- Info del Perfil de la Aspirante -->
  <div class="flex items-center gap-2.5 min-w-0">
    <!-- Avatar con badge de red social -->
    <div class="relative shrink-0">
      <img
        [src]="candidateAvatar"
        [alt]="candidateName"
        class="w-9 h-9 rounded-full object-cover border border-white/20"
      />
      <!-- Badge de plataforma -->
      @if (platform() === 'twitter') {
        <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-black border border-white/20 text-white flex items-center justify-center p-0.5">
          <svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </span>
      } @else if (platform() === 'instagram') {
        <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 text-white flex items-center justify-center p-0.5">
          <svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </span>
      } @else {
        <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-brand-gold text-brand-dark flex items-center justify-center p-0.5 font-bold text-[8px]">
          ★
        </span>
      }
    </div>

    <!-- Nombre y Handle del perfil -->
    <div class="min-w-0">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-bold text-white truncate">{{ candidateName }}</span>
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
      </div>
      <div class="flex items-center gap-1.5 text-[11px] text-gray-400 font-mono">
        <span class="truncate">&#64;{{ handle() }}</span>
        <span class="text-gray-600">•</span>
        <span class="text-[10px] text-brand-gold uppercase tracking-wider font-sans font-semibold">
          {{ platform() === 'twitter' ? 'X Oficial' : (platform() === 'instagram' ? 'Instagram' : 'Red Social') }}
        </span>
      </div>
    </div>
  </div>

  <!-- Botones de Acción: Copiar y Abrir -->
  <div class="flex items-center gap-1.5 shrink-0">
    <button
      type="button"
      (click)="copyLink()"
      class="px-2.5 py-1 rounded-lg bg-brand-dark/90 hover:bg-brand-dark border border-brand-border text-[11px] text-gray-300 hover:text-white transition-all cursor-pointer flex items-center gap-1"
      [title]="copied() ? 'Enlace copiado' : 'Copiar enlace'"
    >
      @if (copied()) {
        <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
        <span class="text-emerald-400 font-medium">Copiado</span>
      } @else {
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span>Copiar</span>
      }
    </button>

    <a
      [href]="url"
      target="_blank"
      rel="noopener noreferrer"
      class="px-3 py-1 rounded-lg bg-brand-gold/15 hover:bg-brand-gold text-brand-gold hover:text-black border border-brand-gold/30 text-[11px] font-semibold transition-all cursor-pointer flex items-center gap-1 shadow-sm"
      title="Abrir perfil oficial en pestaña nueva"
    >
      <span>Ver Perfil</span>
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    </a>
  </div>

</div>
